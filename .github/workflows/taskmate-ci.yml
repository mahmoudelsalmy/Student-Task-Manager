name: TaskMate CI

on:
  push:
    branches: [main, "docs/taskmate-v2-development-plan"]
    paths:
      - "app/**"
      - ".github/workflows/taskmate-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/taskmate-ci.yml"
  workflow_dispatch:

concurrency:
  group: taskmate-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore app/TaskMate.slnx

      - name: Build
        run: dotnet build app/TaskMate.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test app/TaskMate.slnx --configuration Release --no-build --logger "console;verbosity=normal"
